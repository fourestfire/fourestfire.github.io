  <script src="js/three.js"></script>
  <script>
    var scene = new THREE.Scene();
    var camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

    var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.domElement.className = 'three-canvas';
    renderer.domElement.setAttribute('aria-hidden', 'true');
    document.body.appendChild(renderer.domElement);

    var canvas = document.createElement('canvas');
    var context = canvas.getContext('2d');
    canvas.width = 256;
    canvas.height = 256;

    var gradient = context.createLinearGradient(0, 0, canvas.width, canvas.height);
    gradient.addColorStop(0, '#79fff2');
    gradient.addColorStop(0.52, '#6ba5ff');
    gradient.addColorStop(1, '#ffb86b');

    context.fillStyle = gradient;
    context.fillRect(0, 0, canvas.width, canvas.height);

    var texture = new THREE.CanvasTexture(canvas);
    var material = new THREE.MeshBasicMaterial({ map: texture, opacity: 0.82, transparent: true });
    var geometry = new THREE.BoxGeometry(1.7, 1.7, 1.7);

    var cube = new THREE.Mesh(geometry, material);
    scene.add(cube);

    camera.position.z = 8;

    function setCubeForViewport() {
      if (window.innerWidth < 700) {
        cube.position.set(1.45, 2.35, 0);
        cube.scale.set(0.78, 0.78, 0.78);
        return;
      }

      cube.position.set(5.5, -0.8, 0);
      cube.scale.set(1, 1, 1);
    }

    setCubeForViewport();

    function getPointer(event) {
      if (event.touches && event.touches.length > 0) {
        return event.touches[0];
      }

      return event;
    }

    function getPointerPos(event) {
      var pointer = getPointer(event);
      var rect = renderer.domElement.getBoundingClientRect();

      return {
        x: ((pointer.clientX - rect.left) / (rect.right - rect.left)) * 2 - 1,
        y: -((pointer.clientY - rect.top) / (rect.bottom - rect.top)) * 2 + 1
      };
    }

    function updateCubePosition(event) {
      if (event.cancelable) {
        event.preventDefault();
      }

      var pointerPos = getPointerPos(event);
      var vector = new THREE.Vector3(pointerPos.x, pointerPos.y, 0.5);
      vector.unproject(camera);

      var dir = vector.sub(camera.position).normalize();
      var distance = -camera.position.z / dir.z;
      var pos = camera.position.clone().add(dir.multiplyScalar(distance));

      pos.multiplyScalar(0.75);
      cube.position.copy(pos).negate();

      var scaleFactor = 1 + (Math.abs(pointerPos.x) + Math.abs(pointerPos.y)) * 0.28;
      cube.scale.set(scaleFactor, scaleFactor, scaleFactor);
    }

    function resizeRenderer() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      setCubeForViewport();
    }

    window.addEventListener('mousemove', updateCubePosition, false);
    window.addEventListener('touchmove', updateCubePosition, { passive: false });
    window.addEventListener('resize', resizeRenderer, false);

    function render() {
      requestAnimationFrame(render);
      cube.rotation.x += 0.003;
      cube.rotation.y += 0.012;
      cube.rotation.z += 0.001;
      renderer.setClearColor(0x101316, 0);
      renderer.render(scene, camera);
    }

    render();
  </script>
