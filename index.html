  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: #101316;
      color: #f8f7f1;
      font-family: 'Raleway', sans-serif;
      font-size: 16px;
      line-height: 1.6;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .icon-home {
      position: fixed;
      top: 22px;
      left: 26px;
      z-index: 4;
      display: inline-flex;
      gap: 6px;
      align-items: center;
      color: #f8f7f1;
      text-decoration: none;
    }
    .icon-home i { font-size: 18px; }
    .icon-home:hover { color: #9af8e9; }

    main {
      position: relative;
      z-index: 2;
      max-width: 1080px;
      margin: 0 auto;
      padding: 110px 28px 90px;
    }

    .hero {
      margin-bottom: 64px;
      max-width: 720px;
    }

    h1.tbd {
      font-family: 'Crimson Text', serif;
      font-style: italic;
      font-weight: 400;
      font-size: clamp(140px, 26vw, 300px);
      line-height: 0.85;
      letter-spacing: -0.03em;
      margin-bottom: 22px;
    }

    .caption {
      color: #9aa1a3;
      font-size: 14px;
      letter-spacing: 0.04em;
      font-style: italic;
      font-family: 'Crimson Text', serif;
    }

    .stack {
      list-style: none;
      max-width: 600px;
      border-top: 1px solid rgba(248, 247, 241, 0.16);
    }
    .stack li {
      display: grid;
      grid-template-columns: 130px 1fr auto;
      gap: 20px;
      align-items: baseline;
      padding: 18px 0;
      border-bottom: 1px solid rgba(248, 247, 241, 0.16);
    }
    .stack .key {
      font-family: 'Crimson Text', serif;
      font-size: 26px;
      letter-spacing: 0;
    }
    .stack .desc {
      color: #9aa1a3;
      font-size: 14px;
    }
    .stack .tag {
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #6a706c;
      white-space: nowrap;
    }
    .stack .tag.live { color: #9af8e9; }
    .stack a {
      color: inherit; text-decoration: none;
      display: contents;
    }
    .stack a:hover .key { color: #9af8e9; }
    .stack a:hover .tag { color: #9af8e9; }

    footer {
      position: relative;
      z-index: 2;
      max-width: 1080px;
      margin: 0 auto;
      padding: 28px 28px 40px;
      color: #6a706c;
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      display: flex;
      justify-content: space-between;
      gap: 16px;
    }
    footer a { color: #d9dfd7; text-decoration: none; }
    footer a:hover { color: #9af8e9; }

    .three-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
    }

    @media (max-width: 640px) {
      main { padding: 80px 22px 60px; }
      h1.tbd { font-size: clamp(120px, 38vw, 220px); }
      .stack li { grid-template-columns: 1fr auto; }
      .stack .desc { grid-column: 1 / -1; order: 3; }
    }
  </style>
</head>

<body>
  <a href="./index.html" class="icon-home" aria-label="Dean Guo home">
    <i class="fa fa-tree" aria-hidden="true"></i>
    <i class="fa fa-heart" aria-hidden="true"></i>
  </a>

  <main>
    <div class="hero">
      <h1 class="tbd">tbd</h1>
      <p class="caption">currently rebuilding…</p>
    </div>

    <ul class="stack" aria-label="Sections">
      <li>
        <span class="key">now</span>
        <span class="desc">what I'm focused on this week</span>
        <span class="tag">coming soon</span>
      </li>
      <li>
        <span class="key">projects</span>
        <span class="desc">current builds, written up properly</span>
        <span class="tag">coming soon</span>
      </li>
      <li>
        <span class="key">notes</span>
        <span class="desc">build logs &amp; product thinking</span>
        <span class="tag">coming soon</span>
      </li>
      <li>
        <a href="./archive.html">
          <span class="key">older work</span>
          <span class="desc">past project pages, kept for context</span>
          <span class="tag live">live →</span>
        </a>
      </li>
    </ul>
  </main>

  <footer>
    <span>back soon</span>
    <a href="./contact.html">contact</a>
  </footer>

  <script src="js/three.js"></script>
  <script>
    var scene = new THREE.Scene();
    var camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

    var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.domElement.className = 'three-canvas';
    renderer.domElement.setAttribute('aria-hidden', 'true');
    document.body.appendChild(renderer.domElement);

    var canvas = document.createElement('canvas');
    canvas.width = 256; canvas.height = 256;
    var ctx = canvas.getContext('2d');
    var grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
    grad.addColorStop(0, '#79fff2');
    grad.addColorStop(0.52, '#6ba5ff');
    grad.addColorStop(1, '#ffb86b');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    var texture = new THREE.CanvasTexture(canvas);
    var material = new THREE.MeshBasicMaterial({ map: texture, opacity: 0.7, transparent: true });
    var cube = new THREE.Mesh(new THREE.BoxGeometry(1.7, 1.7, 1.7), material);
    scene.add(cube);
    camera.position.z = 8;

    function place() {
      if (window.innerWidth < 700) {
        cube.position.set(1.6, 2.6, 0);
        cube.scale.setScalar(0.78);
      } else {
        cube.position.set(5.5, -0.6, 0);
        cube.scale.setScalar(1);
      }
    }
    place();

    function pointerPos(e) {
      var p = (e.touches && e.touches[0]) ? e.touches[0] : e;
      var r = renderer.domElement.getBoundingClientRect();
      return {
        x: ((p.clientX - r.left) / (r.right - r.left)) * 2 - 1,
        y: -((p.clientY - r.top) / (r.bottom - r.top)) * 2 + 1
      };
    }

    function move(e) {
      if (e.cancelable) e.preventDefault();
      var pp = pointerPos(e);
      var v = new THREE.Vector3(pp.x, pp.y, 0.5);
      v.unproject(camera);
      var dir = v.sub(camera.position).normalize();
      var distance = -camera.position.z / dir.z;
      var pos = camera.position.clone().add(dir.multiplyScalar(distance));
      pos.multiplyScalar(0.75);
      cube.position.copy(pos).negate();
      var s = 1 + (Math.abs(pp.x) + Math.abs(pp.y)) * 0.28;
      cube.scale.set(s, s, s);
    }

    window.addEventListener('mousemove', move, false);
    window.addEventListener('touchmove', move, { passive: false });
    window.addEventListener('resize', function () {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      place();
    });

    function render() {
      requestAnimationFrame(render);
      cube.rotation.x += 0.003;
      cube.rotation.y += 0.012;
      cube.rotation.z += 0.001;
      renderer.setClearColor(0x101316, 0);
      renderer.render(scene, camera);
    }
    render();
  </script>
</body>

</html>
