  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: #101316;
      color: #f8f7f1;
      font-family: 'Raleway', sans-serif;
      overflow: hidden;
    }

    .icon-home {
      position: fixed;
      top: 22px;
      left: 26px;
      z-index: 3;
      display: inline-flex;
      gap: 6px;
      align-items: center;
      color: #f8f7f1;
      text-decoration: none;
    }
    .icon-home i { font-size: 18px; }
    .icon-home:hover { color: #9af8e9; }

    main {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .stack {
      text-align: center;
      max-width: 720px;
    }

    h1 {
      font-family: 'Crimson Text', serif;
      font-style: italic;
      font-weight: 400;
      font-size: clamp(160px, 30vw, 360px);
      line-height: 0.86;
      letter-spacing: -0.03em;
    }

    .caption {
      margin-top: 22px;
      color: #9aa1a3;
      font-size: 12px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    nav.bottom {
      position: fixed;
      bottom: 26px;
      left: 0;
      right: 0;
      z-index: 3;
      display: flex;
      gap: 22px;
      flex-wrap: wrap;
      justify-content: center;
      padding: 0 16px;
      font-size: 13px;
      letter-spacing: 0.04em;
    }
    nav.bottom a {
      color: #d9dfd7;
      text-decoration: none;
      border-bottom: 1px solid rgba(217, 223, 215, 0.25);
      padding-bottom: 2px;
    }
    nav.bottom a:hover { color: #9af8e9; border-color: #9af8e9; }
    nav.bottom span { color: #5a6164; }

    .three-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
    }

    @media (max-width: 600px) {
      h1 { font-size: clamp(120px, 38vw, 220px); }
      .icon-home { top: 18px; left: 20px; }
    }
  </style>
</head>

<body>
  <a href="./index.html" class="icon-home" aria-label="Dean Guo home">
    <i class="fa fa-tree" aria-hidden="true"></i>
    <i class="fa fa-heart" aria-hidden="true"></i>
  </a>

  <main>
    <div class="stack">
      <h1>tbd</h1>
      <p class="caption">deanguo.com — under development</p>
    </div>
  </main>

  <nav class="bottom" aria-label="Sections">
    <span>now (soon)</span>
    <span>projects (soon)</span>
    <a href="./archive.html">older work</a>
    <a href="./contact.html">contact</a>
  </nav>

  <script src="js/three.js"></script>
  <script>
    var scene = new THREE.Scene();
    var camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

    var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.domElement.className = 'three-canvas';
    renderer.domElement.setAttribute('aria-hidden', 'true');
    document.body.appendChild(renderer.domElement);

    var canvas = document.createElement('canvas');
    canvas.width = 256; canvas.height = 256;
    var ctx = canvas.getContext('2d');
    var grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
    grad.addColorStop(0, '#79fff2');
    grad.addColorStop(0.52, '#6ba5ff');
    grad.addColorStop(1, '#ffb86b');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    var texture = new THREE.CanvasTexture(canvas);
    var material = new THREE.MeshBasicMaterial({ map: texture, opacity: 0.32, transparent: true });
    var cube = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.5, 1.5), material);
    scene.add(cube);
    camera.position.z = 8;

    function place() {
      if (window.innerWidth < 700) {
        cube.position.set(-1.6, -2.2, 0);
        cube.scale.setScalar(0.7);
      } else {
        cube.position.set(-5.6, -1.2, 0);
        cube.scale.setScalar(1);
      }
    }
    place();
    window.addEventListener('resize', function () {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      place();
    });

    function render() {
      requestAnimationFrame(render);
      cube.rotation.x += 0.002;
      cube.rotation.y += 0.008;
      renderer.setClearColor(0x101316, 0);
      renderer.render(scene, camera);
    }
    render();
  </script>
</body>

</html>
